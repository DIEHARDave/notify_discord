# notify_discord - Moonraker settings
# install.sh includes this file from mod_data/plugins.moonraker.conf; updates
# replace it, so don't edit it. To change a setting, add a [notify_discord]
# section to mod_data/user.moonraker.conf and restart Moonraker:
#
# [notify_discord]
# # Send plain text again without disabling the plugin
# enabled: False
# # Card title; by default the name: from mod_data/notify.txt
# printer_name: My AD5X

[notify_discord]
